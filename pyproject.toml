[project]
name = "loop"
version = "0.1.0"
description = "Fuzzing loop to discover bugs similar to GPUBreach"
readme = "README.md"
authors = [
    { name = "Hyde Yoo", email = "hydeyoo0716@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.139",
    "pydantic>=2.13.4",
]

[project.scripts]
loop = "loop.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
